image: uhub.service.ucloud.cn/org_bdks4e/node:14.19

pages:
  script:
    - echo >> /etc/hosts '10.76.22.187 registry.npm.pre.ucloudadmin.com'
    - pnpm config set registry https://registry.npm.taobao.org/
    - pnpm install
    - pnpm docs:build
    - rm -rf public && mv docs-dist public
  artifacts:
    paths:
      - public
  only:
    refs:
      - main
      - /^.*feature.*$/
  tags:
    - uaek-c1
